<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Suka Blyat</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    #6424a5 0%,
                    #261044 35%,
                    #0d0618 80%
                );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: 100%;
            max-width: 460px;
            padding: 18px;
            text-align: center;
        }

        /* TITLE */

        .logo {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;

            text-shadow:
                0 0 10px #c84cff,
                0 0 30px #8b24ff;

            margin-bottom: 5px;
        }

        .subtitle {
            color: #bcaaca;
            font-size: 13px;
            margin-bottom: 18px;
        }

        /* BALANCE */

        .balance-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 20px;

            border-radius: 30px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 5px 20px rgba(0,0,0,.3);

            margin-bottom: 20px;
        }

        .balance {
            font-size: 24px;
            font-weight: bold;
        }

        /* MACHINE */

        .machine {
            position: relative;

            padding: 18px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #3b145f,
                    #180c2d
                );

            border: 2px solid #a53dff;

            box-shadow:
                0 0 20px rgba(164, 54, 255, .35),
                0 20px 50px rgba(0,0,0,.6);
        }

        /* LIGHTS */

        .lights {
            display: flex;
            justify-content: space-around;

            margin-bottom: 12px;
        }

        .light {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ffd83d;

            box-shadow:
                0 0 8px #ffd83d,
                0 0 15px #ffd83d;

            animation: blink 0.8s infinite alternate;
        }

        .light:nth-child(2) {
            animation-delay: .15s;
        }

        .light:nth-child(3) {
            animation-delay: .3s;
        }

        .light:nth-child(4) {
            animation-delay: .45s;
        }

        .light:nth-child(5) {
            animation-delay: .6s;
        }

        @keyframes blink {
            from {
                opacity: .25;
            }

            to {
                opacity: 1;
            }
        }

        /* REELS */

        .reels {
            display: flex;

            gap: 9px;

            padding: 12px;

            background: #09050f;

            border-radius: 20px;

            border: 2px solid #57316e;

            box-shadow:
                inset 0 0 25px rgba(0,0,0,.8);
        }

        .reel {
            position: relative;

            flex: 1;

            height: 105px;

            overflow: hidden;

            border-radius: 14px;

            background:
                linear-gradient(
                    90deg,
                    #eee,
                    #fff,
                    #ddd
                );

            box-shadow:
                inset 0 0 15px rgba(0,0,0,.5);
        }

        .reel-strip {
            position: absolute;

            left: 0;
            right: 0;

            top: 0;

            transform: translateY(0);
        }

        .symbol {
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 58px;

            color: #111;
        }

        /* CENTER LINE */

        .line {
            position: absolute;

            left: 0;
            right: 0;

            top: 50%;

            height: 3px;

            transform: translateY(-50%);

            background: #ffcc32;

            box-shadow:
                0 0 8px #ffcc32;

            z-index: 5;

            pointer-events: none;
        }

        /* SPINNING */

        .spinning .reel-strip {
            filter: blur(2px);
        }

        /* BET */

        .controls {
            margin-top: 18px;
        }

        .bet-title {
            color: #b9a8c4;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .bet-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;

            margin-bottom: 15px;
        }

        .bet-button {
            border: 1px solid #63377d;

            background: #24132f;

            color: white;

            border-radius: 10px;

            padding: 8px 13px;

            cursor: pointer;
        }

        .bet-button.active {
            background: #8b25c7;

            border-color: #e16aff;

            box-shadow:
                0 0 10px rgba(220, 80, 255, .5);
        }

        /* SPIN BUTTON */

        .spin {
            width: 100%;

            border: none;

            border-radius: 18px;

            padding: 18px;

            font-size: 24px;

            font-weight: 900;

            color: #351500;

            cursor: pointer;

            background:
                linear-gradient(
                    180deg,
                    #ffe45a,
                    #ffad00
                );

            box-shadow:
                0 7px 0 #b56d00,
                0 12px 30px rgba(255, 173, 0, .3);

            transition: .12s;
        }

        .spin:active {
            transform: translateY(6px);

            box-shadow:
                0 1px 0 #b56d00;
        }

        .spin:disabled {
            opacity: .5;
        }

        /* RESULT */

        .result {
            min-height: 32px;

            margin-top: 17px;

            font-size: 19px;

            font-weight: bold;
        }

        /* WIN */

        .winning {
            animation: winPulse .35s infinite alternate;

            box-shadow:
                0 0 20px #ffd43b,
                0 0 50px #ff9d00,
                inset 0 0 20px #fff;
        }

        @keyframes winPulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.05);
            }
        }

        /* JACKPOT */

        .jackpot {
            animation:
                jackpot .7s infinite alternate;
        }

        @keyframes jackpot {
            from {
                transform: scale(1);
                text-shadow:
                    0 0 10px #ffcc00;
            }

            to {
                transform: scale(1.2);
                text-shadow:
                    0 0 20px #fff,
                    0 0 50px #ff9900;
            }
        }

        /* COINS */

        .coin {
            position: fixed;

            font-size: 28px;

            pointer-events: none;

            animation: coinFall 1.5s ease-out forwards;

            z-index: 100;
        }

        @keyframes coinFall {
            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(100vh)
                    rotate(720deg);

                opacity: 0;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <div class="logo">
        👑 Suka Blyat
    </div>

    <div class="subtitle">
        TRY YOUR LUCK
    </div>

    <div class="balance-box">
        🪙
        <div class="balance" id="balance">
            1000
        </div>
    </div>


    <div class="machine">

        <div class="lights">
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
        </div>


        <div class="reels">

            <div class="reel" id="reel0">
                <div class="reel-strip"></div>
            </div>

            <div class="reel" id="reel1">
                <div class="reel-strip"></div>
            </div>

            <div class="reel" id="reel2">
                <div class="reel-strip"></div>
            </div>

            <div class="line"></div>

        </div>


        <div class="controls">

            <div class="bet-title">
                СТАВКА
            </div>

            <div class="bet-buttons">

                <button class="bet-button active"
                        data-bet="10">
                    10
                </button>

                <button class="bet-button"
                        data-bet="25">
                    25
                </button>

                <button class="bet-button"
                        data-bet="50">
                    50
                </button>

                <button class="bet-button"
                        data-bet="100">
                    100
                </button>

            </div>


            <button class="spin" id="spin">
                🎰 SPIN
            </button>


            <div class="result" id="result">
                Удачи! 🍀
            </div>

        </div>

    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    let balance = 11000;

    let bet = 10;

    let spinning = false;


    const symbols = [
        "🍒",
        "🍋",
        "🍊",
        "🍉",
        "⭐",
        "💎",
        "7️⃣"
    ];


    const reels = [
        document.querySelector("#reel0 .reel-strip"),
        document.querySelector("#reel1 .reel-strip"),
        document.querySelector("#reel2 .reel-strip")
    ];


    const reelBoxes = [
        document.getElementById("reel0"),
        document.getElementById("reel1"),
        document.getElementById("reel2")
    ];


    const balanceElement =
        document.getElementById("balance");

    const result =
        document.getElementById("result");

    const spinButton =
        document.getElementById("spin");


    /*
        Создаём барабаны
    */

    function createReel(strip) {

        strip.innerHTML = "";

        for (let i = 0; i < 35; i++) {

            const symbol = document.createElement("div");

            symbol.className = "symbol";

            symbol.textContent =
                symbols[
                    Math.floor(
                        Math.random() *
                        symbols.length
                    )
                ];

            strip.appendChild(symbol);
        }
    }


    reels.forEach(createReel);


    /*
        Случайный символ
    */

    function randomSymbol() {

        return symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];
    }


    /*
        Ставки
    */

    document.querySelectorAll(".bet-button")
        .forEach(button => {

            button.addEventListener("click", () => {

                if (spinning)
                    return;

                document
                    .querySelectorAll(".bet-button")
                    .forEach(b =>
                        b.classList.remove("active")
                    );

                button.classList.add("active");

                bet =
                    Number(
                        button.dataset.bet
                    );

            });

        });


    /*
        Основной SPIN
    */

    spinButton.addEventListener(
        "click",
        spin
    );


    function spin() {

        if (spinning)
            return;


        if (balance < bet) {

            result.textContent =
                "❌ Недостаточно монет";

            return;
        }


        spinning = true;

        spinButton.disabled = true;


        balance -= bet;

        updateBalance();


        result.textContent =
            "🎰 Вращаем...";


        reelBoxes.forEach(reel =>
            reel.classList.add("spinning")
        );


        /*
            Получаем будущий результат
        */

        const finalResult = [
            randomSymbol(),
            randomSymbol(),
            randomSymbol()
        ];


        /*
            Запускаем барабаны
        */

        reels.forEach(
            (strip, index) => {

                createReel(strip);


                const finalSymbol =
                    finalResult[index];


                const children =
                    strip.children;


                /*
                    Последний символ
                    будет нужным
                */

                children[
                    children.length - 1
                ].textContent =
                    finalSymbol;


                strip.style.transition =
                    "none";

                strip.style.transform =
                    "translateY(0)";


                /*
                    Разное время
                    остановки
                */

                const duration =
                    1800 +
                    index * 550;


                setTimeout(() => {

                    const distance =
                        (children.length - 1)
                        * 105;


                    strip.style.transition =
                        `transform ${duration / 1000}s cubic-bezier(.12,.72,.18,1)`;


                    strip.style.transform =
                        `translateY(-${distance}px)`;


                }, 30);


            }
        );


        /*
            Проверяем результат
        */

        setTimeout(() => {

            finishSpin(finalResult);

        }, 4000);

    }


    /*
        Результат
    */

    function finishSpin(resultArray) {

        reelBoxes.forEach(reel =>
            reel.classList.remove("spinning")
        );


        const [a, b, c] =
            resultArray;


        let win = 0;


        /*
            JACKPOT
        */

        if (
            a === "7️⃣" &&
            b === "7️⃣" &&
            c === "7️⃣"
        ) {

            win = bet * 100;

            result.innerHTML =
                "🔥 JACKPOT 🔥";

            result.classList.add(
                "jackpot"
            );

            createCoins(40);

        }


        /*
            DIAMONDS
        */

        else if (
            a === "💎" &&
            b === "💎" &&
            c === "💎"
        ) {

            win = bet * 50;

            result.textContent =
                "💎 DIAMOND WIN! 💎";

            createCoins(25);

        }


        /*
            Три одинаковых
        */

        else if (
            a === b &&
            b === c
        ) {

            win = bet * 10;

            result.textContent =
                "🎉 БОЛЬШОЙ ВЫИГРЫШ!";

            createCoins(15);

        }


        /*
            Два одинаковых
        */

        else if (
            a === b ||
            b === c ||
            a === c
        ) {

            win = bet * 2;

            result.textContent =
                "✨ Маленький выигрыш!";

        }


        /*
            Проигрыш
        */

        else {

            result.textContent =
                "😢 Не повезло...";
        }


        /*
            Добавляем выигрыш
        */

        if (win > 0) {

            balance += win;

            updateBalance();


            reelBoxes.forEach(reel =>
                reel.classList.add(
                    "winning"
                )
            );


            setTimeout(() => {

                reelBoxes.forEach(reel =>
                    reel.classList.remove(
                        "winning"
                    )
                );

            }, 1000);


            if (tg.HapticFeedback) {

                tg.HapticFeedback
                    .notificationOccurred(
                        "success"
                    );

            }

        }


        else {

            if (tg.HapticFeedback) {

                tg.HapticFeedback
                    .notificationOccurred(
                        "error"
                    );

            }

        }


        setTimeout(() => {

            result.classList.remove(
                "jackpot"
            );

        }, 1500);


        spinning = false;

        spinButton.disabled = false;

    }


    /*
        Баланс
    */

    function updateBalance() {

        balanceElement.textContent =
            balance.toLocaleString("ru-RU");

    }


    /*
        Эффект падающих монет
    */

    function createCoins(amount) {

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            setTimeout(() => {

                const coin =
                    document.createElement("div");

                coin.className = "coin";

                coin.textContent = "🪙";

                coin.style.left =
                    Math.random() * 100 + "vw";

                coin.style.top =
                    "-40px";

                coin.style.animationDuration =
                    (1 + Math.random()) + "s";

                document.body.appendChild(
                    coin
                );


                setTimeout(() => {

                    coin.remove();

                }, 2000);

            }, i * 30);

        }

    }


    updateBalance();

</script>

</body>
</html>
