<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Магазин</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<body>

    <!-- Кнопка возврата в меню -->
    <button id="backButton">← Назад</button>


    <!-- Основная часть магазина -->
<main class="shop">

    <!-- Общий баланс кристаллов -->
<div class="balance">
    💎 <span id="crystalsBalance">0</span>
</div>

    <!-- Заголовок магазина -->
    <h1>Магазин</h1>

    <!-- Контейнер со всеми товарами -->
    <div class="products">

        <!-- Первая карточка товара -->
        <div class="product">

            <!-- Картинка товара -->
            <img src="qa3.png" alt="самозванец">

            <!-- Название товара -->
            <h2>самозванец</h2>

            <!-- Цена товара -->
            <p class="price">
                100 💎
            </p>

            <!--
                data-price хранит цену товара.
                JS будет брать её автоматически.
            -->
            <button class="buyButton" data-price="100">
                Купить
            </button>

        </div>

        <!-- Вторая карточка товара -->
<div class="product">

    <!-- Картинка второго товара -->
    <img src="qa1.png" alt="голубая лагуна">

    <!-- Название второго товара -->
    <h2>голубая лагуна</h2>

    <!-- Цена второго товара -->
    <p class="price">
        500 💎
    </p>

    <!-- Кнопка покупки -->
    <button class="buyButton" data-price="500">
        Купить
    </button>

</div>

        <!-- Третья карточка товара -->
<div class="product">

    <!-- Картинка товара -->
    <img src="qa.png" alt="один в поле воин">

    <!-- Название товара -->
    <h2>один в поле воин</h2>

    <!-- Цена товара -->
    <p class="price">
        1000 💎
    </p>

    <!-- Кнопка покупки -->
    <button class="buyButton" data-price="1000">
        Купить
    </button>

</div>

        <!--
            ЗДЕСЬ ПОТОМ МОЖНО ДОБАВЛЯТЬ НОВЫЕ КАРТОЧКИ
        -->

    </div>

    <!-- Сообщение после покупки -->
    <p id="message"></p>

</main>

    <script src="script.js"></script>

</body>
</html>
