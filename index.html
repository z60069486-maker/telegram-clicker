<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Games</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #39206b,
                    #12091d 70%
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu {

            width: 100%;
            max-width: 430px;

            padding: 30px;

            text-align: center;
        }

        .title {

            font-size: 36px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .subtitle {

            color: #aaa;

            font-size: 16px;

            margin-bottom: 40px;
        }

        .game-button {

            width: 100%;

            padding: 20px;

            margin-bottom: 15px;

            border: none;

            border-radius: 18px;

            font-size: 22px;
            font-weight: bold;

            color: white;

            cursor: pointer;

            transition: 0.15s;

            box-shadow:
                0 7px 20px rgba(0,0,0,0.35);
        }

        .game-button:active {

            transform: scale(0.96);

        }

        .clicker {

            background: linear-gradient(
                135deg,
                #ffb300,
                #ff7b00
            );

        }

        .casino {

            background: linear-gradient(
                135deg,
                #d62cff,
                #712cff
            );

        }

        .emoji {

            font-size: 32px;

            margin-right: 8px;
        }

    </style>

</head>


<body>

<div class="menu">

    <div class="title">
        🎮 MY GAMES
    </div>

    <div class="subtitle">
        Выбери игру
    </div>


    <!-- КЛИКЕР -->

    <button
        class="game-button clicker"
        onclick="openGame('clicker.html')"
    >

        <span class="emoji">🪙</span>

        Кликер

    </button>


    <!-- КАЗИНО -->

    <button
        class="game-button casino"
        onclick="openGame('casino.html')"
    >

        <span class="emoji">🎰</span>

        Казино

    </button>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    function openGame(page) {

        window.location.href = page;

    }

</script>

</body>

</html>
