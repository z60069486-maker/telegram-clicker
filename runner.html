<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Road Rush</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        #game {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #222;
        }

        .hud {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;

            display: flex;
            justify-content: space-between;

            color: white;
            font-size: 20px;
            font-weight: bold;

            z-index: 10;
            pointer-events: none;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.55);
            padding: 10px 15px;
            border-radius: 12px;
        }

        .game-over {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            background: rgba(0, 0, 0, 0.75);

            color: white;
            text-align: center;

            z-index: 20;
        }

        .game-over.show {
            display: flex;
        }

        .game-over h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .game-over p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .restart {
            border: none;
            padding: 15px 35px;
            border-radius: 15px;

            background: #ffcc00;
            color: #111;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        .controls {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;

            display: flex;
            justify-content: center;
            gap: 25px;

            z-index: 10;
        }

        .control {
            width: 75px;
            height: 60px;

            border: none;
            border-radius: 18px;

            background: rgba(255,255,255,0.18);
            color: white;

            font-size: 30px;
        }

        .control:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>

<body>

<canvas id="game"></canvas>

<div class="hud">
    <div class="score-box">
        🪙 <span id="coins">0</span>
    </div>

    <div class="score-box">
        🏆 <span id="score">0</span>
    </div>
</div>

<div class="controls">
    <button class="control" id="left">⬅️</button>
    <button class="control" id="right">➡️</button>
</div>

<div class="game-over" id="gameOver">

    <h1>💥 АВАРИЯ!</h1>

    <p>
        Счёт: <span id="finalScore">0</span><br>
        Монеты: <span id="finalCoins">0</span>
    </p>

    <button class="restart" id="restart">
        🔄 Ещё раз
    </button>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {
    width = canvas.width = window.innerWidth * devicePixelRatio;
    height = canvas.height = window.innerHeight * devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    width = window.innerWidth;
    height = window.innerHeight;
}

window.addEventListener("resize", resize);

resize();


// ==========================
// НАСТРОЙКИ
// ==========================

const roadWidth = 330;
const lanes = 3;

let laneWidth;

let playerLane = 1;

let coins = 0;
let score = 0;

let speed = 7;

let roadOffset = 0;

let objects = [];

let gameRunning = true;

let spawnTimer = 0;


// ==========================
// МАШИНКА
// ==========================

const player = {

    width: 55,
    height: 90,

    y: 0,

    get x() {

        const roadLeft = width / 2 - roadWidth / 2;

        return (
            roadLeft +
            laneWidth * playerLane +
            laneWidth / 2 -
            this.width / 2
        );

    }

};


// ==========================
// ПОЛОСА
// ==========================

function getRoadLeft() {

    return width / 2 - roadWidth / 2;

}


// ==========================
// РИСУЕМ ДОРОГУ
// ==========================

function drawRoad() {

    ctx.fillStyle = "#20752c";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const roadLeft = getRoadLeft();


    ctx.fillStyle = "#333";

    ctx.fillRect(
        roadLeft,
        0,
        roadWidth,
        height
    );


    // края дороги

    ctx.fillStyle = "#eee";

    ctx.fillRect(
        roadLeft,
        0,
        5,
        height
    );

    ctx.fillRect(
        roadLeft + roadWidth - 5,
        0,
        5,
        height
    );


    // разделители полос

    laneWidth = roadWidth / lanes;

    ctx.strokeStyle = "#aaa";
    ctx.lineWidth = 4;

    ctx.setLineDash([35, 35]);

    ctx.lineDashOffset = roadOffset;

    for (let i = 1; i < lanes; i++) {

        const x =
            roadLeft +
            laneWidth * i;

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);

        ctx.stroke();

    }

    ctx.setLineDash([]);
}


// ==========================
// МАШИНКА
// ==========================

function drawPlayer() {

    const x = player.x;

    const y =
        height -
        150;


    // тень

    ctx.fillStyle = "rgba(0,0,0,0.35)";

    ctx.fillRect(
        x + 5,
        y + 8,
        player.width,
        player.height
    );


    // корпус

    ctx.fillStyle = "#e63946";

    roundRect(
        x,
        y,
        player.width,
        player.height,
        12
    );


    // стекло

    ctx.fillStyle = "#7dd3fc";

    roundRect(
        x + 8,
        y + 15,
        player.width - 16,
        25,
        7
    );


    // капот

    ctx.fillStyle = "#ff6b6b";

    roundRect(
        x + 7,
        y + 48,
        player.width - 14,
        25,
        6
    );


    // фары

    ctx.fillStyle = "#fff3a3";

    ctx.fillRect(
        x + 7,
        y + 5,
        12,
        7
    );

    ctx.fillRect(
        x + player.width - 19,
        y + 5,
        12,
        7
    );


    // колёса

    ctx.fillStyle = "#111";

    ctx.fillRect(
        x - 5,
        y + 15,
        7,
        22
    );

    ctx.fillRect(
        x + player.width - 2,
        y + 15,
        7,
        22
    );

    ctx.fillRect(
        x - 5,
        y + 58,
        7,
        22
    );

    ctx.fillRect(
        x + player.width - 2,
        y + 58,
        7,
        22
    );

}


// ==========================
// КРУГЛЫЕ ПРЯМОУГОЛЬНИКИ
// ==========================

function roundRect(x, y, w, h, r) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        w,
        h,
        r
    );

    ctx.fill();

}


// ==========================
// СОЗДАНИЕ ОБЪЕКТОВ
// ==========================

function spawnObject() {

    const lane =
        Math.floor(
            Math.random() * lanes
        );


    const isCoin =
        Math.random() < 0.55;


    objects.push({

        lane: lane,

        y: -60,

        type: isCoin
            ? "coin"
            : "obstacle",

        size: isCoin
            ? 25
            : 55

    });

}


// ==========================
// РИСОВАНИЕ ОБЪЕКТОВ
// ==========================

function drawObject(obj) {

    const x =
        getRoadLeft() +
        laneWidth * obj.lane +
        laneWidth / 2;


    if (obj.type === "coin") {

        ctx.font = "28px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "🪙",
            x,
            obj.y
        );

    } else {

        ctx.font = "48px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "🚧",
            x,
            obj.y
        );

    }

}


// ==========================
// ПРОВЕРКА СТОЛКНОВЕНИЙ
// ==========================

function checkCollision(obj) {

    const playerY =
        height - 150;


    if (
        obj.lane !== playerLane
    ) {
        return false;
    }


    if (
        obj.y > playerY - 50 &&
        obj.y < playerY + 70
    ) {

        return true;

    }

    return false;

}


// ==========================
// ДВИЖЕНИЕ
// ==========================

function moveLeft() {

    if (!gameRunning) return;

    if (playerLane > 0) {

        playerLane--;

    }

}


function moveRight() {

    if (!gameRunning) return;

    if (playerLane < lanes - 1) {

        playerLane++;

    }

}


// ==========================
// КЛАВИАТУРА
// ==========================

document.addEventListener(
    "keydown",
    e => {

        if (e.key === "ArrowLeft") {

            moveLeft();

        }

        if (e.key === "ArrowRight") {

            moveRight();

        }

    }
);


// ==========================
// КНОПКИ
// ==========================

document
    .getElementById("left")
    .addEventListener(
        "click",
        moveLeft
    );


document
    .getElementById("right")
    .addEventListener(
        "click",
        moveRight
    );


// ==========================
// СВАЙПЫ
// ==========================

let touchStartX = 0;

document.addEventListener(
    "touchstart",
    e => {

        touchStartX =
            e.touches[0].clientX;

    }
);


document.addEventListener(
    "touchend",
    e => {

        const touchEndX =
            e.changedTouches[0].clientX;

        const diff =
            touchEndX - touchStartX;


        if (Math.abs(diff) < 40) {
            return;
        }


        if (diff < 0) {

            moveLeft();

        } else {

            moveRight();

        }

    }
);


// ==========================
// GAME OVER
// ==========================

function gameOver() {

    gameRunning = false;

    document
        .getElementById("finalScore")
        .textContent = score;

    document
        .getElementById("finalCoins")
        .textContent = coins;

    document
        .getElementById("gameOver")
        .classList.add("show");


    if (tg.HapticFeedback) {

        tg.HapticFeedback.notificationOccurred(
            "error"
        );

    }

}


// ==========================
// РЕСТАРТ
// ==========================

document
    .getElementById("restart")
    .addEventListener(
        "click",
        () => {

            objects = [];

            coins = 0;

            score = 0;

            speed = 7;

            playerLane = 1;

            roadOffset = 0;

            spawnTimer = 0;

            gameRunning = true;


            document
                .getElementById("gameOver")
                .classList.remove("show");

        }
    );


// ==========================
// ГЛАВНЫЙ ЦИКЛ
// ==========================

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawRoad();


    if (gameRunning) {

        roadOffset += speed;

        if (roadOffset > 70) {
            roadOffset = 0;
        }


        spawnTimer--;

        if (spawnTimer <= 0) {

            spawnObject();

            spawnTimer =
                Math.max(
                    35,
                    80 - speed * 3
                );

        }


        // скорость постепенно растёт

        speed += 0.002;

        score += 0.05;


        // объекты

        for (
            let i = objects.length - 1;
            i >= 0;
            i--
        ) {

            const obj = objects[i];

            obj.y += speed;


            if (
                checkCollision(obj)
            ) {

                if (
                    obj.type === "coin"
                ) {

                    coins++;

                    objects.splice(
                        i,
                        1
                    );

                    continue;

                } else {

                    gameOver();

                    continue;

                }

            }


            if (
                obj.y > height + 100
            ) {

                objects.splice(
                    i,
                    1
                );

            }

        }

    }


    // рисуем объекты

    objects.forEach(
        drawObject
    );


    // машинка

    drawPlayer();


    // HUD

    document
        .getElementById("coins")
        .textContent =
        coins;


    document
        .getElementById("score")
        .textContent =
        Math.floor(score);


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
